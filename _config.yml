baseurl: ''
exclude: ['README.md']
permalink: pretty
title: 'FakeWS'
description: 'Fake AWS for Local Development - Run S3, DynamoDB, SQS, SNS, IAM and more locally'
encoding: utf-8
domain: fakews.com
url: https://fakews.com

collections:
  services:
    output: true
    permalink: /services/:path/

defaults:
  - scope:
      type: services
    values:
      layout: service
      bodyClass: page-services-single
  - scope:
      path: 'images'
    values:
      image: true

sass:
  style: compact

google_analytics_id: UA-950385-33

plugins:
  - jekyll-environment-variables
